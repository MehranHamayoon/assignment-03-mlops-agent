[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "assignment-03-mlops-agent"
version = "1.0.0"
description = "An evidence-based, permissioned MLOps tool-calling agent"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "pydantic-settings>=2.7,<3",
  "httpx>=0.28,<1", "mlflow>=3.5,<4", "dvc>=3.60,<4",
  "kubernetes>=32,<36", "scikit-learn>=1.6,<2", "pandas>=2.2,<3", "PyYAML>=6,<7"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-cov>=6,<8", "ruff>=0.11,<1"]

[project.scripts]
mlops-agent = "agent.main:main"

[tool.setuptools.packages.find]
include = ["agent*", "api*", "training*", "scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

